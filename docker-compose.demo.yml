name: finance-interview-demo
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finance_demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Run scripts/demo first}
      POSTGRES_DB: finance_interview_demo
    volumes:
      - demo_database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U finance_demo -d finance_interview_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://finance_demo:${DEMO_DB_PASSWORD}@postgres:5432/finance_interview_demo
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Required}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Required}
      FINANCE_DEMO_CONTAINER: '1'
      EMBEDDING_MODEL: /app/data/models/finance-embedding
      UPLOAD_DIR: /app/data/uploads
      RAG_UPLOAD_DIR: /app/data/uploads/documents
    volumes:
      - ./data/demo/interview:/app/data/demo/interview:ro
      - demo_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 20
  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:8081:80'
    depends_on:
      backend:
        condition: service_healthy
volumes:
  demo_database:
  demo_uploads:
