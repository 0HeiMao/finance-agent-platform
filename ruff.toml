# ⑦ 后端 lint：ruff 的配置。
#
# 为什么规则集要显式写出来：ruff 的「默认规则」在不同版本间变过（本机 0.16.10 的默认集远比
# 老版本的 E4/E7/E9/F 宽），不写死就会出现「换个机器、换个版本，门禁红绿不一样」。
#
# 用法：
#     .\.venv\Scripts\ruff.exe check .          # 门禁里跑的就是这一条（scripts/check_all.py）
#     .\.venv\Scripts\ruff.exe check . --fix    # 自动修可修的
#
# 有意**不**选的规则，以及理由：
#   E402  module-import-not-at-top-of-file —— 本项目多处「先改环境变量 / 先 sys.path 再 import」
#         （空库探针要先设 DATABASE_URL、CI 自检要先插仓库根），E402 会要求把 import 提到前面，
#         那是错的顺序。
#   E701/E702 一行多条语句 —— `if not x: return` / `except ...: pass` 是本仓库的既有风格，
#         拆成多行只会让这些守卫变啰嗦。
#   B008  function-call-in-default-argument —— FastAPI 的 `Depends(...)` / `Query(...)` 写在
#         默认参数里是框架的标准写法，不是「请求期求值」的 bug。
#   RUF 全族 —— RUF001/002/003 会把中文全角标点当成「易混淆字符」批量误报（本仓库注释与提示
#         文案全是中文）；RUF100 会要求删掉那些为「没启用的规则」写的 `# noqa`，与上面的
#         E402/B008 冲突。
#   E501  行长 —— 中文注释与提示文案本身就长，行宽交给评审，不做强制（前端那边有 prettier 管）。
#   UP031 百分号格式化 —— 三个真机脚本用 `"...%s..." % json.dumps(x)` 往**浏览器里执行的 JS 片段**
#         插字面量，片段本身全是花括号（`() => { ... }`），改成 f-string 就得把每个花括号写成双份，
#         可读性反而更差。其余地方已经改成 f-string 了。
target-version = "py311"
line-length = 110

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "PIE"]
ignore = ["E402", "E701", "E702", "B008", "UP031"]
