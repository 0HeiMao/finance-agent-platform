# 持续集成：push / PR 时跑「不需要演示数据、不需要向量模型、不需要模型 Key」的那部分门禁。
#
# 覆盖（两项，各自完全可复现）：
#   后端 job — scripts/check_all.py --quick、scripts/verify_ci_workflow.py、
#              scripts/check_coverage.py（覆盖率门槛，内部就是 pytest 全量）
#   前端 job — npm ci、npm test（node --test 全量）、scripts/check_frontend_coverage.py
#              （覆盖率门槛，跑同一套用例）、npm run build
#
# 有意**不**覆盖（见 README「持续集成（CI）」）：需要演示库 / 470MB 向量模型 / 真模型 API Key 的
# 真机脚本（scripts/verify_*.py、scripts/check_pages.py、scripts/ui_components_smoke.py）。
# 它们留在本地，由 `PRECOMMIT_FULL=1 git commit` 与交付前的手工验收负责——放进流水线只会
# 变成「永远红着没人看」，比不跑更糟。
#
# 这里的关键不是「把命令抄一遍」，而是**换一个空库跑**：本地库是老库（结构早就补齐、演示数据都在），
# 空库才会暴露「只有老库能跑」的假设。第一次跑就抓到了两个真问题：
#   ① `ensure_schema()` 不装 `vector` 扩展 → 建 `document_chunks` 时
#      `type "vector" does not exist`（老库是初始化脚本建的，所以一直没暴露）；
#   ② 有一条用例的断言依赖「演示库里恰好有一行不完整的 2026 年度落库」，
#      空库上直接失败（已改成用例自己播一个缺月季度）。
name: CI

on:
  push:
  pull_request:

# 同一个分支连续 push 时，只保留最新那次：CI 是「当前代码能不能过」，不是历史审计。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 仓库里的脚本/报告输出全是中文：runner 的 locale 不保证是 UTF-8，
  # 少了这一行会以 UnicodeEncodeError 的形式炸在打印上（而不是炸在被测代码上）。
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"

jobs:
  backend:
    name: 后端（结构门禁 + 覆盖率门槛）
    runs-on: ubuntu-latest
    # 必须和 docker-compose.yml 用同一个镜像：`document_chunks.embedding` 是 VECTOR(384)，
    # 换成普通 postgres 会在建这张表时报 `type "vector" does not exist`（这是真发生过的）。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # 库是空库（只有服务容器建出来的空库），测试自己建表——这正是「新机器第一次跑」的样子。
      DATABASE_URL: postgresql+psycopg://finance:finance@127.0.0.1:5432/finance
      # 必须显式给：否则配置层会把仓库占位密钥换成随机串并往工作区写 .env（CI 里是多余的副作用）。
      AUTH_SECRET_KEY: ci-only-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # sentence-transformers 会拖 torch：Linux 上默认解析出 CUDA 版（约 2.5GB）。
      # 先装 CPU 版轮子，pip 就认为 torch 已满足——CI 不跑向量模型，只是 import 时需要它存在。
      - name: 安装 CPU 版 torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 结构门禁（文件编码 + .py 解析）
        run: python scripts/check_all.py --quick
      - name: 工作流自检（镜像/环境变量/脚本路径的不变量）
        run: python scripts/verify_ci_workflow.py
      # 覆盖率门槛脚本内部就是 `python -m pytest`：`-m` 会把项目根放进 sys.path，
      # 裸 `pytest` 在 runner 上会 `ModuleNotFoundError: backend`。跑完再由它卡住
      # 语句/分支覆盖率，并在有用例被跳过时直接失败。
      - name: 后端测试 + 覆盖率门槛（空库，从零建表）
        run: python scripts/check_coverage.py

  frontend:
    name: 前端（node --test + 生产构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 用 npm ci 而不是 npm install：只有它按 lockfile 精确还原，
      # 也只有在 lockfile 与 package.json 不同步时才会报错（那时本地也该先跑一次 npm install）。
      - name: 安装依赖（按 lockfile）
        run: npm ci
      - name: 前端测试（node --test）
        run: npm test
      # node 自带的覆盖表由脚本自己解析并卡阈值（`--test-coverage-lines` 要 node 22+，
      # 而这里固定 node 20）。它跑的是同一套用例，所以与 `npm test` 并排、不替代它。
      - name: 前端覆盖率门槛
        working-directory: .
        run: python3 scripts/check_frontend_coverage.py
      - name: 生产构建
        run: npm run build
