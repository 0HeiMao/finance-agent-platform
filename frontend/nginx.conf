# 前端站点配置：静态托管 + 同源反代 /api。
#
# 为什么走反代而不是让浏览器直连后端 8000：`frontend/src/api/client.js` 默认用相对路径
# `/api/v1`，同源时天然没有 CORS 问题，也不需要在构建时把后端地址烧进静态包
# （否则换一台机器部署就得重新构建）。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 前端路由（/dashboard、/admin/audit …）都靠前端自己渲染，
    # 直接刷新这些地址时 nginx 必须回 index.html，否则 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存；index.html 不行（否则新版本发不出去）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent 的流式问答是 SSE：默认的响应缓冲会把整段回答攒完再吐出来，
        # 表现就是"点了发送先卡十几秒，然后文字一次性蹦出来"。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
